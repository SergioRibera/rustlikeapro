# CI workflow template (rustlikeapro). Copy to .github/workflows/ci.yml.
#
# Hardening: for hardened repos pin every third-party action to a full commit SHA with a
# version comment (`uses: owner/action@<sha> # v2.9.3`) and let Dependabot/Renovate bump them.
# See references/ci-hardening.md. Run zizmor (job at the bottom) to audit this file.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Weekly: catches new advisories and upstream breakage.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable # Use @nightly only if rustfmt.toml enables unstable options.
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  typos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli
      - run: typos

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features --document-private-items --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features --locked
      - run: cargo test --workspace --doc --all-features --locked # nextest does not run doc tests.

  features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack check --workspace --each-feature --no-dev-deps

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.0 # Keep equal to `rust-version` in Cargo.toml.
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          log-level: error

  # Optional: extra targets. Check (not test) where tests cannot run.
  # wasm:
  #   runs-on: ubuntu-24.04
  #   steps:
  #     - uses: actions/checkout@v7
  #       with:
  #         persist-credentials: false
  #     - uses: dtolnay/rust-toolchain@stable
  #       with:
  #         targets: wasm32-unknown-unknown
  #     - uses: Swatinem/rust-cache@v2
  #     - run: cargo check --workspace --lib --target wasm32-unknown-unknown --locked
  #
  # android:
  #   runs-on: ubuntu-24.04
  #   steps:
  #     - uses: actions/checkout@v7
  #       with:
  #         persist-credentials: false
  #     - uses: dtolnay/rust-toolchain@stable
  #       with:
  #         targets: aarch64-linux-android
  #     - uses: Swatinem/rust-cache@v2
  #     - run: cargo check --workspace --lib --target aarch64-linux-android --locked

