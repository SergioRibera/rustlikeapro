# rustfmt.toml template (rustlikeapro). Stable options only, so `cargo fmt` works on stable.
edition = "2024"
style_edition = "2024"
max_width = 100
use_field_init_shorthand = true
use_try_shorthand = true
newline_style = "Unix"

# Nightly-only options. Enabling any of them forces `cargo +nightly fmt` locally and a nightly
# fmt job in CI (pin the nightly in a separate toolchain file). Worth it for large teams:
# imports_granularity = "Module"
# group_imports = "StdExternalCrate"
# wrap_comments = true
# comment_width = 100
# format_code_in_doc_comments = true
